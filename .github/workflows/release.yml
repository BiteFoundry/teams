name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            package: teams-win32-x64
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            package: teams-win32-arm64
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-15-intel
            package: teams-darwin-x64
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            package: teams-darwin-arm64
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            package: teams-linux-x64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            package: teams-linux-arm64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig (for GLIBC 2.28 Linux builds)
        if: matrix.os == 'ubuntu-latest'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary (Linux GLIBC 2.28 via cargo-zigbuild)
        if: matrix.os == 'ubuntu-latest'
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.28

      - name: Verify Linux GLIBC <= 2.28 compatibility
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/verify-glibc.mjs "target/${{ matrix.target }}/release/teams" --max 2.28

      - name: Smoke test binary on AlmaLinux 8 container
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-gnu/release:/work:ro" almalinux:8 /work/teams --version
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-gnu/release:/work:ro" almalinux:8 /work/teams --help >/dev/null

      - name: Build release binary
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary into npm package
        run: node scripts/build-npm.mjs --target ${{ matrix.target }}

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          name="teams-${version}-${{ matrix.target }}"
          mkdir -p release-staging
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "release-staging/${name}.zip" "target/${{ matrix.target }}/release/teams.exe"
            if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
              cp "target/${{ matrix.target }}/release/teams.exe" "release-staging/teams.exe"
            fi
          else
            tar -czf "release-staging/${name}.tar.gz" -C "target/${{ matrix.target }}/release" teams
          fi

      - name: Stage npm artifact directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp -R "npm/${{ matrix.package }}" staging/

      - name: Upload npm platform package
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: staging
          if-no-files-found: error

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: release-staging/*
          if-no-files-found: error

  publish:
    name: publish npm packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download npm packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: npm-*
          merge-multiple: true

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")

          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

          node scripts/sync-version.mjs --check
          node scripts/verify-glibc.mjs --self-test

          for package in teams-win32-x64 teams-win32-arm64 teams-darwin-x64 \
                         teams-darwin-arm64 teams-linux-x64 teams-linux-arm64; do
            if [ ! -f "dist/${package}/package.json" ]; then
              echo "missing dist/${package}/package.json" >&2
              exit 1
            fi
            if [ ! -d "dist/${package}/bin" ]; then
              echo "missing dist/${package}/bin" >&2
              exit 1
            fi
            actual=$(node -p "require('./dist/${package}/package.json').version")
            if [ "${actual}" != "${version}" ]; then
              echo "${package} version ${actual} != ${version}" >&2
              exit 1
            fi
          done

          test -f bin/teams.js
          test -f scripts/postinstall.mjs
          test -f dist/teams-win32-x64/bin/teams.exe
          test -f dist/teams-win32-arm64/bin/teams.exe
          test -f dist/teams-darwin-x64/bin/teams
          test -f dist/teams-darwin-arm64/bin/teams
          test -f dist/teams-linux-x64/bin/teams
          test -f dist/teams-linux-arm64/bin/teams

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for dir in dist/teams-*; do
            echo "publishing $(basename "${dir}")"
            npm publish "${dir}" --access public
          done

      - name: Publish root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  release:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Prepare release notes body
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'Prebuilt pure Microsoft Teams binary (`teams` / `teams.exe`) — CLI, TUI, HTTP API, and MCP server.'
            if [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then
              echo ""
              cat "release-notes/${GITHUB_REF_NAME}.md"
            fi
          } > release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body_path: release-body.md
