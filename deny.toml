[advisories]
version = 2
ignore = [
    # Transitive from ratatui 0.29.0 (lru 0.12.5, low severity IterMut Stacked Borrows).
    # Remove once ratatui upgrades lru to >= 0.16.3.
    "RUSTSEC-2026-0002",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = [
    "https://github.com/BiteFoundry/bitefoundry-html",
]
